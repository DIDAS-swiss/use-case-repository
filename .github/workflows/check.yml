# Checks that the data holds together: the working-group assignment follows its
# rules, and every entry refers only to sectors, flows, patterns, credentials,
# use cases and I14Y datasets that exist. See scripts/check_data.py. The tests
# in tests/ check that the issue form, the intake and the links comment agree
# (current and earlier bodies parse, regeneration is stable, reconcile is read only).
name: Check data

on:
  pull_request:
    paths:
      - "_data/**"
      - "use-cases/**"
      - "credentials/**"
      - "scripts/**"
      - "intake/**"
      - "tests/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "use-cases/**"
      - "credentials/**"
      - "scripts/**"
      - "intake/**"
      - "tests/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Check
        run: python3 scripts/check_data.py
      - name: Form, intake and links tests
        run: python3 -m unittest discover -s tests -v
