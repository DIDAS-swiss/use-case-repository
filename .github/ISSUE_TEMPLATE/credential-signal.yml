name: Credential need / supply signal
description: Signal that a credential is needed, or that you could issue one
title: "[Credential] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Demand and supply signals appear on the gap board as soon as they are filed;
        no approval is needed. Check the [credentials index](https://github.com/DIDAS-swiss/use-case-repository/blob/main/credentials/README.md)
        first. If the credential is there, you can also add a 👍 or a comment to its open issue.
  - type: dropdown
    id: kind
    attributes:
      label: Signal
      options:
        - Need — we would verify this credential
        - Supply — we could issue this credential
    validations:
      required: true
  - type: input
    id: credential
    attributes:
      label: Credential
      description: What the credential attests. Use the name from the credentials index if it is listed.
      placeholder: e.g. Vehicle registration
    validations:
      required: true
  - type: textarea
    id: claims
    attributes:
      label: Facts to be proven
      description: The claims needed (for a need) or available (for supply).
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: Use case(s)
      description: Which use cases depend on it? Link published entries or candidate issues.
  - type: input
    id: organisation
    attributes:
      label: Organisation
      description: Who signals the need, or who could issue
  - type: textarea
    id: scale
    attributes:
      label: Indicative scale and timing (optional)
      description: Expected interactions per year, target date. Say "estimate" where it is one.
  - type: textarea
    id: mandate
    attributes:
      label: Mandate and data (supply only)
      description: On what basis do you hold the data or the mandate to attest it?
  - type: textarea
    id: schema
    attributes:
      label: Schema references (optional)
      description: Links to I14Y, eCH or sectoral schemas, if any exist.
