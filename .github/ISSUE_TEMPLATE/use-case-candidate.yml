name: Use-case candidate
description: Propose a business use case in which verifiable data is exchanged
labels:
  - use-case
  - 'stage: signal'
body:
  - type: markdown
    attributes:
      value: 'Thank you for proposing a use case. Plain prose is fine; a curator will help

        turn it into a structured entry (see [GOVERNANCE.md](https://github.com/DIDAS-swiss/use-case-repository/blob/main/GOVERNANCE.md)).

        Please first check the [published use cases](https://github.com/DIDAS-swiss/use-case-repository/blob/main/use-cases/README.md)

        and the [open candidates](https://github.com/DIDAS-swiss/use-case-repository/issues?q=is%3Aissue+label%3Ause-case) for duplicates.

        '
  - type: input
    id: title
    attributes:
      label: Use case
      description: A short name for the outcome, not the organisation
      placeholder: e.g. Vehicle leasing
    validations:
      required: true
  - type: input
    id: entry_id
    attributes:
      label: Short id (optional)
      description: Lower-case words joined by hyphens; it becomes the file name of the published entry.
      placeholder: e.g. vehicle-leasing
  - type: input
    id: titles
    attributes:
      label: Title in German, French and Italian (optional)
      description: Where you know them.
      placeholder: 'DE: Fahrzeugleasing · FR: Leasing de véhicules · IT: Leasing di veicoli'
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: The situation today, the decision taken, and what changes when the data arrives as verifiable credentials.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 'Outcome: what must be proven (optional)'
      description: The facts the verifier needs proven to take the decision, one per line, stated as claims rather than documents.
      placeholder: 'The applicant lives at the declared address

        The applicant has no open debt enforcement proceedings'
  - type: textarea
    id: actors
    attributes:
      label: Actors and roles
      description: Who holds, who verifies, who issues, who governs. Name organisations where you can.
      placeholder: 'Holder: lessee (person)

        Verifier: leasing company

        Issuers: road traffic office, insurer'
    validations:
      required: true
  - type: textarea
    id: process_flow
    attributes:
      label: Process flow (optional)
      description: 'The steps, one per line: actor, action, credential.'
      placeholder: '1. Lessee: applies and identifies with the e-ID

        2. Leasing company: requests residence and debt enforcement proofs'
  - type: textarea
    id: design_basis
    attributes:
      label: Design basis (optional)
      description: Official designs, specifications or pilots the flow follows, with links.
  - type: textarea
    id: credentials
    attributes:
      label: Credentials needed
      description: Which facts or documents does the verifier need? Say which are reused from another use case, which are new, and which are deliberately not requested.
    validations:
      required: true
  - type: dropdown
    id: described_credentials
    attributes:
      label: Credentials described in this repository (optional)
      description: Pick the credentials above that already have an entry; each is linked on the issue. Describe new ones in the field above.
      multiple: true
      options:
        - "accident-report · Accident report"
        - "beta-id · Beta-ID"
        - "debt-enforcement-extract · Debt enforcement register extract"
        - "immunization-record · Immunization record"
        - "motor-vehicle-liability-insurance-confirmation · Motor vehicle liability insurance confirmation"
        - "repair-assessment · Repair assessment"
        - "residence-confirmation · Residence confirmation"
        - "salary-employment-confirmation · Salary and employment confirmation"
        - "swiss-e-id · Swiss e-ID"
        - "vehicle-registration · Vehicle registration"
  - type: dropdown
    id: i14y_credentials
    attributes:
      label: Credentials already on I14Y (optional)
      description: Credential datasets published on I14Y, the Swiss interoperability platform, whatever their registration status. Pick those this use case relies on.
      multiple: true
      options:
        - "urn:vct:ch.admin.bcs.betaid · Beta-ID (CH_FEDPOL, Recorded)"
        - "urn:vct:ch.egovernment.residency-permit-simple · Einfache Wohnsitzbestätigung (CH_DVS, Candidate)"
  - type: textarea
    id: schemas
    attributes:
      label: Emerging or other schemas (optional)
      description: 'For credentials not on I14Y: where a schema is in preparation or already used, for example in a pilot, an eCH standard or a sector repository. One line per credential, with a link and how far it is.'
      placeholder: 'Immunization record: urn:vct:ch.didas.health.immunization:1.0, showcase schema in digital-health_swiyu, not yet on I14Y

        Vehicle registration: no schema known

        '
  - type: checkboxes
    id: ambition
    attributes:
      label: Ambition level(s)
      description: 'AL1: e-ID · AL2: credentials from public authorities · AL3: credentials from private and other non-state actors'
      options:
        - label: AL1
        - label: AL2
        - label: AL3
  - type: dropdown
    id: sectors
    attributes:
      label: Sector(s)
      description: ISIC Rev. 5, as used by the DIDAS Industry Function Graph. Pick the most specific level that fits; a section (letter) is fine where no division is listed. Missing a division? Name it under "Situation and outcome".
      multiple: true
      options:
        - "ISIC-A · Agriculture, forestry and fishing"
        - "ISIC-B · Mining and quarrying"
        - "ISIC-C · Manufacturing"
        - "— ISIC-21 · Manufacture of basic pharmaceutical products and pharmaceutical preparations"
        - "— — ISIC-2100 · Manufacture of pharmaceuticals, medicinal chemical and botanical products"
        - "— ISIC-30 · Manufacture of other transport equipment"
        - "— — ISIC-3030 · Manufacture of air and spacecraft and related machinery"
        - "ISIC-D · Electricity, gas, steam and air conditioning supply"
        - "ISIC-E · Water supply; sewerage, waste management and remediation activities"
        - "ISIC-F · Construction"
        - "ISIC-G · Wholesale and retail trade"
        - "— ISIC-47 · Retail trade"
        - "— — ISIC-4711 · Non-specialized retail sale with food, beverages or tobacco predominating"
        - "ISIC-H · Transportation and storage"
        - "ISIC-I · Accommodation and food service activities"
        - "— ISIC-56 · Food and beverage service activities"
        - "— — ISIC-5610 · Restaurants and mobile food service activities"
        - "ISIC-J · Publishing, broadcasting, and content production and distribution activities"
        - "ISIC-K · Telecommunications, computer programming, consultancy, computing infrastructure, and other information service activities"
        - "— ISIC-62 · Computer programming, consultancy and related activities"
        - "ISIC-L · Financial and insurance activities"
        - "— ISIC-64 · Financial service activities, except insurance and pension funding"
        - "— — ISIC-6419 · Other monetary intermediation"
        - "— ISIC-65 · Insurance, reinsurance and pension funding, except compulsory social security"
        - "— — ISIC-6512 · Non-life insurance"
        - "ISIC-M · Real estate activities"
        - "ISIC-N · Professional, scientific and technical activities"
        - "ISIC-O · Administrative and support service activities"
        - "ISIC-P · Public administration and defence; compulsory social security"
        - "— ISIC-84 · Public administration and defence; compulsory social security"
        - "— — ISIC-8411 · General public administration activities"
        - "ISIC-Q · Education"
        - "— ISIC-85 · Education"
        - "— — ISIC-8531 · General secondary education"
        - "— — ISIC-8540 · Tertiary education"
        - "ISIC-R · Human health and social work activities"
        - "— ISIC-86 · Human health activities"
        - "— — ISIC-8610 · Hospital activities"
        - "ISIC-S · Arts, sports and recreation"
        - "ISIC-T · Other service activities"
        - "ISIC-U · Activities of households as employers; undifferentiated goods- and services-producing activities of households for own use"
        - "ISIC-V · Activities of extraterritorial organizations and bodies"
  - type: markdown
    attributes:
      value: '### Anchors

        This repository is where the other DIDAS work meets. Link what already exists

        for this use case, so that nobody has to find it again.

        '
  - type: dropdown
    id: trust_flows
    attributes:
      label: Trust flows (optional)
      description: Flows from the DIDAS Trust Flow Diagram Repository that model this use case or a step of it.
      multiple: true
      options:
        - "banking/kyc-credential/kyc-onboarding · Online onboarding and KYC credential issuance (in-progress)"
        - "banking/kyc-credential/kyc-sharing · KYC credential sharing (in-progress)"
        - "banking/kyc-credential/re-kyc · Re-KYC periodic reevaluation (in-progress)"
        - "banking/re-identification-forgotten-password/online-banking-reidentification · Online banking re-identification (in-progress)"
        - "banking/re-identification-age-of-majority/qes-18 · QES for 18-year-old re-identification (in-progress)"
        - "education/certificates-and-enrolment/high-school-certificate-issuance · High school certificate issuance (in-progress)"
        - "education/certificates-and-enrolment/university-immatriculation · University immatriculation (in-progress)"
        - "health/immunization/F-01 · Becoming an actor in the health trust domain (partial)"
        - "health/immunization/F-02 · Recording an administered dose (implemented)"
        - "health/immunization/F-03 · Presenting vaccination evidence with minimal disclosure (implemented)"
        - "health/immunization/F-04 · Check-in at the practice (implemented)"
        - "health/immunization/F-05 · Prescription and its redemption (implemented)"
        - "health/immunization/F-06 · Correction, suspension and revocation (partial)"
        - "health/immunization/F-07 · Projecting a presented credential into FHIR and openEHR (implemented)"
        - "health/immunization/F-08 · Assembling an International Patient Summary from held credentials (roadmap)"
        - "health/immunization/F-09 · Secondary use under revocable research consent (roadmap)"
        - "health/immunization/F-10 · Wearables and continuous data (roadmap)"
        - "health/public-health-statistics/F-11 · Answering the national coverage survey (roadmap)"
        - "Not listed: linked under Other flow diagrams"
  - type: dropdown
    id: ifm_patterns
    attributes:
      label: Use case pattern in the Industry Function Graph (optional)
      description: The sector-neutral pattern(s) this use case realises. Pick the closest; if none fits, say so under "Situation and outcome".
      multiple: true
      options:
        - "eid-issuance · Electronic identity issuance"
        - "identity-verification · Identity verification"
        - "qualification-verification · Qualification verification"
        - "accreditation-verification · Accreditation verification"
        - "age-threshold-verification · Age threshold verification"
        - "due-diligence-onboarding · Onboarding with regulatory due diligence"
        - "due-diligence-refresh · Periodic due diligence re-evaluation"
        - "credential-recovery-reidentification · Re-identification for credential recovery"
        - "legal-capacity-reidentification · Re-identification at a change of legal capacity"
        - "education-qualification-issuance · Education qualification issuance"
        - "tertiary-admission · Tertiary admission"
        - "employment-engagement · Employment engagement"
        - "patient-record-matching · Patient record matching"
        - "public-service-access · Public service access"
        - "supplier-qualification · Supplier qualification"
        - "No pattern fits yet"
  - type: textarea
    id: other_flows
    attributes:
      label: Other flow diagrams (optional)
      description: Flows modelled elsewhere, for example in a showcase repository or a specification. Links.
  - type: textarea
    id: implementations
    attributes:
      label: Implementations, pilots and showcases (optional)
      description: Running code, demos, pilots or deployments of this use case. Link and state how far each goes (demo, sandbox, pilot, production).
      placeholder: 'https://github.com/DIDAS-swiss/digital-health_swiyu (sandbox demo, mocked swiyu components)

        '
  - type: dropdown
    id: glossary_terms
    attributes:
      label: DIDAS Glossary terms (optional)
      description: Terms of the DIDAS Glossary this use case relies on; each is linked on the issue.
      multiple: true
      options:
        - "ambition-level · ambition level"
        - "beta-id · Beta-ID"
        - "claim · claim"
        - "credential · credential"
        - "didas · DIDAS"
        - "digital-product-passport · digital product passport"
        - "e-collecting · E-Collecting"
        - "ebpi · EBPI"
        - "ecosystem · ecosystem"
        - "governance · governance"
        - "governing-authority · governing authority"
        - "international-patient-summary · International Patient Summary"
        - "issuer · issuer"
        - "minute-of-agreement · Minute of Agreement"
        - "protocol · protocol"
        - "selective-disclosure · selective disclosure"
        - "status-list · status list"
        - "trust-domain · trust domain"
        - "trust-infrastructure · trust infrastructure"
        - "trust-marker · trust marker"
        - "trust-protocol · trust protocol"
        - "trust-statement · trust statement"
        - "verifiable-credential · verifiable credential"
        - "verifier · verifier"
        - "wallet · wallet"
  - type: textarea
    id: related_use_cases
    attributes:
      label: Related use cases (optional)
      description: Use cases related without a sequence. Their ids, one per line, from the [list of use-case ids](https://didas-swiss.github.io/use-case-repository/use-case-ids.html); each is linked on the issue.
      placeholder: 'vehicle-leasing

        residence-confirmation'
  - type: textarea
    id: upstream_use_cases
    attributes:
      label: Upstream use cases (optional)
      description: Use cases that must happen first, because they issue a credential this one verifies. Ids from the [list of use-case ids](https://didas-swiss.github.io/use-case-repository/use-case-ids.html), one per line.
      placeholder: 'vehicle-leasing

        residence-confirmation'
  - type: textarea
    id: downstream_use_cases
    attributes:
      label: Downstream use cases (optional)
      description: Use cases that reuse a credential this one issues. Ids from the [list of use-case ids](https://didas-swiss.github.io/use-case-repository/use-case-ids.html), one per line.
      placeholder: 'vehicle-leasing

        residence-confirmation'
  - type: dropdown
    id: lighthouse
    attributes:
      label: Lighthouse proposal (optional)
      description: Propose this use case as a lighthouse candidate if it meets most of the criteria in GOVERNANCE.md (reach, benefit for administration and business, a repeatable building block, a confirmed issuer, feasible within about 12 months, internationally interoperable). Selection is a decision of DIDAS.
      options:
        - No proposal
        - Propose as lighthouse candidate
        - Selected as lighthouse (DIDAS decision)
  - type: textarea
    id: lighthouse_basis
    attributes:
      label: Why a lighthouse (optional)
      description: Which criteria it meets, in a line or two.
  - type: textarea
    id: governance
    attributes:
      label: Legal basis and governance (optional)
      description: Laws, regulations, sector frameworks or supervisory bodies that apply.
  - type: textarea
    id: demand
    attributes:
      label: Demand and value (optional)
      description: Who would rely on it, how often, and what would it improve?
  - type: textarea
    id: open_questions
    attributes:
      label: Coordination needs and open questions (optional)
      description: What has to happen, and who has to act, for this use case to move on.
  - type: input
    id: organisation
    attributes:
      label: Proposed on behalf of (optional)
      description: Organisation, if any. Leave empty to propose as an individual.
  - type: textarea
    id: sources
    attributes:
      label: Sources (optional)
      description: Links to process descriptions, studies, legal texts.
